plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'sanju.newproject'
    compileSdk 35

    defaultConfig {
        applicationId "sanju.newproject"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField "String", "GEMINI_KEY", "\"${project.findProperty('GEMINI_API_KEY') ?: ''}\""
        }
        release {
            optimization {
                enable false
            }
            buildConfigField "String", "GEMINI_KEY", "\"${project.findProperty('GEMINI_API_KEY') ?: ''}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    
    // ML Kit Language Identification & Translation & Text Recognition
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    
    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Retrofit & Gson for Gemini API
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}